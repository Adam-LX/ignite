# Auto-triage player-report issues (deploy to Adam-LX/ignite-releases).
name: Triage player report

on:
  issues:
    types: [opened, labeled]

jobs:
  triage:
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'player-report')
      || github.event.label.name == 'player-report'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Triage labels + checklist comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = (issue.body || '').toLowerCase();
            const title = (issue.title || '').toLowerCase();
            const blob = `${title}\n${body}`;
            const want = new Set(['player-report']);
            if (/black-bars|letterbox|menuBloomLikely|czarne|drawingbuffer/.test(blob)) {
              want.add('visual');
              want.add('black-bars');
            }
            if (/room-list|open rooms|lobby|pokoj|online/.test(blob)) {
              want.add('online');
              want.add('room-list');
            }
            if (/fillbots|bots|bot /.test(blob)) want.add('bots');
            if (/crash|exception|rejection|errors/.test(blob)) want.add('crash');
            if (/p95|avgfps|frame|perf/.test(blob)) want.add('perf');

            const existing = new Set((issue.labels || []).map(l => l.name));
            const toAdd = [...want].filter(l => !existing.has(l));
            if (toAdd.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: toAdd,
              });
            }

            const marker = '<!-- ignite-player-report-triage -->';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 30,
            });
            if (comments.data.some(c => (c.body || '').includes(marker))) return;

            const checklist = [
              marker,
              '## Auto triage',
              '',
              '- [ ] Reproduce on local build',
              '- [ ] Check viewport / DPR / drawingBuffer (black bars)',
              '- [ ] Check Online room list + fillBots toggle',
              '- [ ] Review match log + recent errors in JSON',
              '',
              `Labels suggested: ${[...want].join(', ')}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: checklist,
            });
