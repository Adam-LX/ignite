<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ignite scorebug HUD</title>
<link rel="stylesheet" href="/src/style.css"/>
<style>
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 80% 60% at 50% 30%,#1a3050,#070d16)}
#hud{display:block!important}
</style></head><body>
<div id="hud">
  <div id="scoreboard-cluster">
    <div id="scoreboard">
      <div class="team-block blue"><div class="team-block__plate">
        <span class="team-label">BLUE</span>
        <span class="team-score">2</span>
      </div></div>
      <div id="score-center"><span id="match-status">3:42</span></div>
      <div class="team-block orange"><div class="team-block__plate">
        <span class="team-label">ORANGE</span>
        <span class="team-score">1</span>
      </div></div>
    </div>
  </div>
</div>
</body></html>
